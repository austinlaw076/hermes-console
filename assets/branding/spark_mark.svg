<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Hermes Console — "Spark mark": RETRATO de la mascota (chispa con ojos +
       nodos en órbita + trazas) sobre glow ámbar. Misma familia que la
       mascota animada de la app. Sin texto, pensado para fondo oscuro. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="49%" r="55%">
      <stop offset="0%" stop-color="#F6B86A" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#E8821C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#E8821C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBD39A"/>
      <stop offset="38%" stop-color="#F0A848"/>
      <stop offset="100%" stop-color="#E8821C"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFF7EC"/>
      <stop offset="68%" stop-color="#FBD39A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- halo -->
  <circle cx="128" cy="126" r="120" fill="url(#glow)"/>
  <!-- trazas de conexión núcleo→nodos -->
  <g stroke="#F0A848" stroke-opacity="0.3" stroke-width="2.4">
    <line x1="128" y1="128" x2="178" y2="92"/>
    <line x1="128" y1="128" x2="78" y2="164"/>
  </g>
  <!-- cuerpo de la chispa (4 puntas cóncavas) -->
  <path d="M128 76
           C133.67 112.87 143.13 122.33 180 128
           C143.13 133.67 133.67 143.13 128 180
           C122.33 143.13 112.87 133.67 76 128
           C112.87 122.33 122.33 112.87 128 76 Z"
        fill="url(#body)"/>
  <!-- núcleo brillante -->
  <circle cx="128" cy="123" r="26" fill="url(#core)"/>
  <!-- ojos -->
  <circle cx="119.5" cy="122" r="5" fill="#1A1206" fill-opacity="0.78"/>
  <circle cx="136.5" cy="122" r="5" fill="#1A1206" fill-opacity="0.78"/>
  <!-- nodos en órbita -->
  <circle cx="178" cy="92" r="6.4" fill="#F0A848"/>
  <circle cx="78" cy="164" r="5.6" fill="#F0A848" fill-opacity="0.9"/>
</svg>
