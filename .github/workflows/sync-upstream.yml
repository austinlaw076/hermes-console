name: Sync Upstream via Pull Request

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# The workflow may create a branch and a PR, but it must never mutate main.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: xP3ta/hermes-console
  TARGET_REPOSITORY: austinlaw076/hermes-console

jobs:
  sync-upstream:
    name: Prepare upstream sync PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target main
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0
          ref: main

      - name: Fetch and prepare leased branch
        id: sync
        shell: bash
        env:
          UPSTREAM_REPOSITORY: ${{ env.UPSTREAM_REPOSITORY }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin main
          git fetch --no-tags upstream main
          expected_main="$(git rev-parse origin/main)"
          echo "expected_main=${expected_main}" >> "$GITHUB_OUTPUT"
          sync_branch="automation/upstream-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "sync_branch=${sync_branch}" >> "$GITHUB_OUTPUT"
          git switch --create "$sync_branch" --no-track origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "sync_status=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit --no-ff upstream/main; then
            echo "sync_status=clean" >> "$GITHUB_OUTPUT"
          else
            if ! git diff --name-only --diff-filter=U > /tmp/conflicted_files.txt || ! test -s /tmp/conflicted_files.txt; then
              git merge --abort || true
              echo "Upstream sync failed without a conflict marker" >&2
              exit 1
            fi

            conflict_report=".github/upstream-sync/conflicts/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
            git merge --abort
            mkdir -p "$(dirname "$conflict_report")"
            {
              printf '%s\n\n' '# Upstream sync requires manual conflict resolution'
              printf '%s\n' "- Upstream: ${UPSTREAM_REPOSITORY}"
              printf '%s\n' "- Target: ${TARGET_REPOSITORY}"
              printf '%s\n' "- Workflow run: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
              printf '%s\n\n' '- Conflicted paths:'
              sed 's/^/- /' /tmp/conflicted_files.txt
              printf '\n%s\n' 'This branch is informational only. It does not modify main.'
            } > "$conflict_report"
            git add "$conflict_report"
            git commit -m "chore: record upstream sync conflict"
            echo "conflict_report=${conflict_report}" >> "$GITHUB_OUTPUT"
            echo "sync_status=conflict" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet origin/main...HEAD; then
            echo "sync_status=noop" >> "$GITHUB_OUTPUT"
          fi

      - name: Push leased sync branch
        if: ${{ steps.sync.outputs.sync_status != 'noop' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "${{ steps.sync.outputs.expected_main }}" || {
            echo 'origin/main changed during sync; refusing to publish a stale branch' >&2
            exit 1
          }
          git push --set-upstream origin "${{ steps.sync.outputs.sync_branch }}"

      - name: Open clean sync PR
        if: ${{ steps.sync.outputs.sync_status == 'clean' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --repo "$TARGET_REPOSITORY" \
            --base main \
            --head "${{ steps.sync.outputs.sync_branch }}" \
            --title 'chore: sync upstream changes' \
            --body 'Automated upstream sync. Review and merge this PR; main is never changed by the workflow.'

      - name: Open conflict report PR
        if: ${{ steps.sync.outputs.sync_status == 'conflict' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --repo "$TARGET_REPOSITORY" \
            --base main \
            --head "${{ steps.sync.outputs.sync_branch }}" \
            --title 'chore: upstream sync requires manual conflict resolution' \
            --body-file "${{ steps.sync.outputs.conflict_report }}"

      - name: Notify local Hermes handoff of conflict
        if: ${{ always() && steps.sync.outcome == 'success' && steps.sync.outputs.sync_status == 'conflict' }}
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_URL" || { echo 'WEBHOOK_URL is not configured' >&2; exit 1; }
          test -n "$WEBHOOK_SECRET" || { echo 'WEBHOOK_SECRET is not configured' >&2; exit 1; }
          delivery_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          timestamp="$(date -u +%s)"
          payload="$(jq -cn \
            --arg event 'upstream_conflict' \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$TARGET_REPOSITORY" \
            --arg action 'resolve_conflict' \
            --arg delivery_id "$delivery_id" \
            --argjson conflicted_files "$(jq -R -s 'split("\n") | map(select(length > 0))' /tmp/conflicted_files.txt)" \
            '{event:$event,timestamp:$timestamp,repo:$repo,conflicted_files:$conflicted_files,action:$action,delivery_id:$delivery_id}')"
          signature="$(printf '%s.%s' "$timestamp" "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | sed 's/^.* //')"
          curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "${WEBHOOK_URL%/}/webhook/upstream-conflict" \
            -H 'Content-Type: application/json' \
            -H "X-Hermes-Timestamp: $timestamp" \
            -H "X-Hermes-Delivery: $delivery_id" \
            -H "X-Hermes-Signature: sha256=$signature" \
            --data-binary "$payload"