# Configuración de gen-l10n (flutter gen-l10n / build con `generate: true`).
# ARB base = español; la clase generada es `Strings` (AppLocalizations).
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-localization-file: app_localizations.dart
output-class: Strings
nullable-getter: false

# Base locale `zh` (app_zh.arb) is required by gen-l10n whenever zh_Hant exists;
# content mirrors Traditional Chinese. Runtime AppLocales still maps Hans/CN → en.
